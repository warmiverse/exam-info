<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจสอบข้อมูลการประเมินสมรรถนะตามสาขาอาชีพ</title>
<style>
:root{--bg:#eaf3fb;--card:#fff;--text:#14233a;--muted:#55657d;--line:#d3e3f3;--navy:#073568;--gold:#f2c94c;--sky:#dbeafa;--hero:#073568;--h3:#073568;--num:#073568;--link:#0b4a97;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#081525;--card:#10243d;--text:#e8eef7;--muted:#a3b3c9;--line:#1f3a5c;--sky:#173456;--hero:#0b2a52;--h3:#f2c94c;--num:#f2c94c;--link:#9cc4f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#081525;--card:#10243d;--text:#e8eef7;--muted:#a3b3c9;--line:#1f3a5c;--sky:#173456;--hero:#0b2a52;--h3:#f2c94c;--num:#f2c94c;--link:#9cc4f5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.65}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 48px}
.hero{background:var(--hero);color:#fff;border-radius:16px;border-bottom:4px solid var(--gold);padding:18px 20px;margin-bottom:14px}
h1{font-size:1.45rem;margin:0 0 4px;color:#fff}
.sub{color:#cfe0f5;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:12px 16px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:1.9rem;color:var(--num);line-height:1.2}
.stat span{color:var(--muted);font-size:.8rem}
.filters{display:grid;gap:8px;margin-bottom:8px}
@media(min-width:700px){.filters{grid-template-columns:1fr 1.4fr .6fr}}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:2px}
select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select:focus-visible,.head:focus-visible,.combo input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
.combo{position:relative}
.combo input{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.combo input::placeholder{color:var(--text);opacity:.75}
.lst{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0;padding:4px;list-style:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.lst li{padding:8px 10px;border-radius:8px;cursor:pointer;overflow-wrap:anywhere}
.lst li.on{background:var(--sky)}
.lst li[aria-selected="true"]{font-weight:700}
.lst li.none{color:var(--muted);cursor:default}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--muted);font-size:.9rem}
.bar button{font:inherit;font-size:.85rem;color:var(--link);background:none;border:0;cursor:pointer;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.head{width:100%;text-align:left;font:inherit;color:var(--text);background:none;border:0;padding:12px 16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.lv{flex:none;background:var(--gold);color:#073568;border-radius:999px;padding:1px 12px;font-size:.82rem;font-weight:700;margin-top:2px}
.ttl b{display:block}.ttl span{color:var(--muted);font-size:.82rem}
.body{display:none;padding:0 16px 14px;border-top:1px solid var(--line);background:var(--card)}
.card.open{border-color:var(--gold)}
.card.open .body{display:block}
.sec h3{font-size:.9rem;color:var(--h3);margin:14px 0 2px}
.sec div{white-space:pre-line;font-size:.93rem;overflow-wrap:anywhere}
a{color:var(--link)}
.empty{text-align:center;color:var(--muted);padding:32px 0}
.foot{color:var(--muted);font-size:.8rem;margin-top:20px;text-align:center}

.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{font:inherit;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel[hidden]{display:none}
.summary{background:var(--sky);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:10px;overflow-wrap:anywhere}
.chk{display:flex;gap:6px;align-items:center;font-size:.88rem;color:var(--muted);margin:0}
.grp{font-size:1rem;color:var(--h3);margin:16px 0 8px}
.rit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;display:grid;gap:4px 12px;grid-template-columns:1fr}
@media(min-width:700px){.rit{grid-template-columns:200px 1fr auto;align-items:center}}
.rit.past{opacity:.6}
.rd b{display:block}
.today{display:inline-block;background:var(--gold);color:#073568;border-radius:999px;font-size:.75rem;font-weight:700;padding:0 8px;margin-top:2px}
.rm b{display:block}.rm span{color:var(--muted);font-size:.82rem}
.rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ty{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted)}
.ty.up{border-color:var(--gold);color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><h1>ตรวจสอบข้อมูลการประเมินสมรรถนะตามสาขาอาชีพ</h1>
  <p class="sub">เลือกสาขา อาชีพ และระดับ เพื่อดูรายละเอียดการประเมินและรอบวันประเมิน</p></header>
  <div class="filters">
    <div><label for="fbq">สาขา</label><select id="fb" class="sr" tabindex="-1" aria-hidden="true"></select><div class="combo"><input id="fbq" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="ทุกสาขา (พิมพ์เพื่อค้นหา)"><ul class="lst" role="listbox" hidden></ul></div></div>
    <div><label for="fjq">อาชีพ</label><select id="fj" class="sr" tabindex="-1" aria-hidden="true"></select><div class="combo"><input id="fjq" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="ทุกอาชีพ (พิมพ์เพื่อค้นหา)"><ul class="lst" role="listbox" hidden></ul></div></div>
    <div><label for="fl">ระดับ</label><select id="fl"></select></div>
  </div>
  <div class="bar"><span></span><button id="reset" type="button">ล้างตัวกรอง</button></div>
  <div class="tabs" role="tablist">
    <button class="tab" id="t1" role="tab" aria-controls="p1" aria-selected="true" type="button">รายละเอียดการประเมิน</button>
    <button class="tab" id="t2" role="tab" aria-controls="p2" aria-selected="false" type="button">รอบและวันประเมิน</button>
  </div>
  <section class="panel" id="p1" role="tabpanel" aria-labelledby="t1">
    <div class="stats">
      <div class="stat"><small>จำนวนอาชีพ</small><b id="nJob">0</b> <span id="tJob"></span></div>
      <div class="stat"><small>จำนวนระดับ</small><b id="nLv">0</b> <span id="tLv"></span></div>
    </div>
    <div class="bar"><span id="count"></span></div>
    <div id="list"></div>
  </section>
  <section class="panel" id="p2" role="tabpanel" aria-labelledby="t2" hidden>
    <div class="stats">
      <div class="stat"><small>จำนวนรายการประเมิน</small><b id="nRit">0</b></div>
      <div class="stat"><small>จำนวนรอบประเมิน</small><b id="nRnd">0</b></div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="bar"><span id="rcount"></span><label class="chk"><input type="checkbox" id="past"> แสดงรอบที่ผ่านมาแล้ว</label></div>
    <div id="rlist"></div>
  </section>
  <p class="foot">ข้อมูลเพื่อประกอบการเตรียมตัว กรุณาตรวจสอบประกาศอย่างเป็นทางการก่อนสมัครสอบ</p>
</div>
<script>
const DATA = [{"branch":"สาขางานระบบผลิตไฟฟ้า","job":"อาชีพผู้ปฏิบัติงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า","level":"6","qual":"1. มีอายุไม่ต่ำกว่า 25 ปีบริบูรณ์\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า ข้อใดข้อหนึ่งดังต่อไปนี้\n- เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องโรงไฟฟ้า ระดับ 4 และมีประสบการณ์ทำงานอยู่ใน ระดับ 4 ไม่น้อยกว่า 3 ปี โดยต้องมีแฟ้มสะสมผลงาน (Portfolio) ยืนยัน\n- เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องโรงไฟฟ้า ระดับ 5 และมีประสบการณ์ทำงานอยู่ใน ระดับ 5 ไม่น้อยกว่า 1 ปี โดยต้องมีแฟ้มสะสมผลงาน (Portfolio) ยืนยัน\n- เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องโรงไฟฟ้า ระดับ 6 และมีประสบการณ์ทำงานอยู่ใน ระดับ 6 ไม่น้อยกว่า 1 ปี\nหรือ\n3. มีประสบการณ์ในการทำงานในโรงไฟฟ้า และปฎิบัติงานเกี่ยวข้องกับงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า โดยมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 6 ปี และมีแฟ้มสะสมผลงาน (Portfolio) ยืนยันประสบการณ์การทำงาน","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- ตรวจติดตามสมรรถนะและความพร้อมจ่ายโรงไฟฟ้า\n- วิเคราะห์แนวทางการปรับปรุงสมรรถนะโรงไฟฟ้า\n- ติดตามการผลิตไฟฟ้าให้ได้ตามสัญญา Power Purchase Agreement (PPA)\n- ควบคุมการทดสอบสมรรถนะโรงไฟฟ้า (Performance Test)\n- สนับสนุนงานบำรุงรักษาแบบหยุดตามวาระ (Planned Outage)\n- จัดทำรายงานอุบัติการณ์ (Incident Report)","pass":"- เกณฑ์คะแนนแฟ้มสะสมผลงานผ่าน 70% ของคะแนนเต็ม หรือคิดเป็น 70 คะแนน\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- แฟ้มสะสมผลงานเวลา 30 นาที\n- สัมภาษณ์ จำนวน 6 หน่วย เวลาไม่เกิน 60 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า ระดับ 6 https://els.egat.co.th/enrol/index.php?id=2319"},{"branch":"สาขางานระบบผลิตไฟฟ้า","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษากังหันแก๊ส","level":"5","qual":"1. ผ่านการฝึกอบรมหลักสูตรที่เกี่ยวข้องกับการปฏิบัติงาน ดังนี้\n- ผ่านการอบรมด้านความปลอดภัยอาชีวอนามัย และสภาพแวดล้อมในการทำงานเกี่ยวกับที่อับอากาศ\n- ผ่านหลักสูตรการฝึกอบรมให้สัญญาณแก่ผู้บังคับปั้นจั่น ผู้ยึดเกาะวัสดุ และผู้ให้สัญญาณ\n2. มีวุฒิการศึกษามีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือเทียบเท่า สาขาที่เกี่ยวข้อง และมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 6 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) หรือสูงกว่า สาขาที่เกี่ยวข้อง เช่น ช่างยนต์ ช่างกลโรงงาน ฯลฯ และมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 4 ปีอย่างต่อเนื่อง\nหรือ\n3. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าพลังความร้อนร่วม ระดับ 4 และต้องปฏิบัติงานในอาชีพระดับ 4 ไม่น้อยกว่า 3 ปีอย่างต่อเนื่อง","units":"หน่วยสมรรถนะด้านความปลอดภัย (Safety Unit)\n- ปฏิบัติงานบำรุงรักษากังหันแก๊ส (Gas Turbine) ด้วยความปลอดภัย\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาระบบนำอากาศเข้า (Air Inlet Section)\n- บำรุงรักษาระบบอัดอากาศ (Compressor และ Inlet Guide Vane : IGV)\n- บำรุงรักษาระบบเผาไหม้ (Combustion Section)\n- บำรุงรักษาระบบกังหันแก๊ส (Turbine Section)\n- บำรุงรักษาระบบอากาศออก (Exhaust Section)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 70 ข้อ\n- ข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- ข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย\nจำนวน 100 ข้อ\nเวลา 100 นาที\n- ข้อสอบอัตนัย\nจำนวน 5 หน่วย\nเวลาไม่เกิน 90 นาที\n- สัมภาษณ์\nจำนวน 6 หน่วย\nเวลาไม่เกิน 60 นาที","els":"1. หลักสูตรท .php?id=2314"},{"branch":"สาขางานระบบผลิตไฟฟ้า","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้า","level":"4","qual":"1. มีอายุไม่ต่ำกว่า 20 ปีบริบูรณ์\n2. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพ (ปวช.) สาขาที่เกี่ยวข้องและมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้องและมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับปริญญาตรีหรือสูงกว่า สาขาวิศวกรรมศาสตร์/อุตสาหกรรมศาสตร์/ครุศาสตร์อุตสาหกรรม/วิทยาศาสตร์ หรือสาขาอื่น ๆ ที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n3. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 และต้องมีประสบการณ์ในตำแหน่งระดับ 3 ไม่น้อยกว่า 1 ปี\n4. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังความร้อนหรือความร้อนร่วม ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดหรืองานบำรุงรักษาอุปกรณ์ไฟฟ้า ไม่น้อยกว่า 2 ปี\n5. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังความร้อนหรือความร้อนร่วม ในอาชีพที่เกี่ยวข้องกับงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้า หรืองานเดินเครื่องโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ภายในโรงไฟฟ้าไม่น้อยกว่า 3 ปี\n6. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าชนิดอื่น ๆ หรือในอุตสาหกรรมอื่น ๆ ในอาชีพที่เกี่ยวข้องไม่น้อยกว่า 4 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าเชิงป้องกัน (Preventive Maintenance: PM)\n- บำรุงรักษาระบบควบคุมแล n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพ (ปวช.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับปริญญาตรีหรือสูงกว่าสาขาวิศวกรรมศาสตร์/อุตสาหกรรมศาสตร์/ครุศาสตร์อุตสาหกรรม/วิทยาศาสตร์ หรือสาขาอื่น ๆ ที่เกี่ยวข้อง และมีประสบการณ์ในการทำงาน ที่เกี่ยวข้องไม่น้อยกว่า1 ปีอย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n3. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 และต้องมีประสบการณ์ทำงานในระดับ 3 ไม่น้อยกว่า 1 ปี\n4. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังความร้อนหรือความร้อนร่วม ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าไม่น้อยกว่า 2 ปี\n5. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังความร้อนหรือความร้อนร่วม ในอาชีพที่เกี่ยวข้องกับงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้า หรือ งานเดินเครื่องโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ภายในโรงไฟฟ้าไม่น้อยกว่า 3 ปี\n6. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าชนิดอื่น ๆ หรือในอุตสาหกรรมอื่น ๆ ในอาชีพที่เกี่ยวข้องไม่น้อยกว่า 4 ปีและมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าเชิงป้องกัน (Preventive Maintenance: PM)\n- บำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าในโรงไฟฟ้าพลังความร้อนที่ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในงานบำรุงรักษาอุปกรณ์เครื่ ังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าเชิงป้องกัน (Preventive Maintenance: PM)\n- บำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าในโรงไฟฟ้าพลังความร้อน ที่ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าพลังความร้อน\n- ควบคุมงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าเชิงป้องกัน (Preventive Maintenance: PM) และเชิงแก้ไข (Corrective Maintenance: CM)\n- ควบคุมงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าแบบหยุดตามวาระ (Planned Outage) ตามสัญญาการให้บริการงานบำรุงรักษาและสัญญา ประกันภัย (Insurance Agreement)\n- จัดทำและติดตาม ข้อกำหนดและขอบเขตการดำเนินงาน (TOR) ของงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้า\n- นำเสนอแผนการปรับเปลี่ยนอุปกรณ์เครื่องกลโรงไฟฟ้าของโรงไฟฟ้าพลังความร้อน","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 84 ข้อ\n- ข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- ข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 120 ข้อ เวลา 120 นาที\n- ข้อสอบอัตนัย จำนวน 4 หน่วย เวลาไม่เกิน 90 นาที\n- สัมภาษณ์ จำนวน 9 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าพลังความร้อน ระดับ 5 https://els.egat.co.th/enrol/index.php?id=2617"},{"branch":"สาขางานระบบผลิตไฟฟ้า","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์เครื่องกลโรงไฟฟ้าพลังความร้อน","level":"6","qual":"1. มีอายุไม่ต่ำกว่า 25 ปีบริบูรณ์\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า ://els.egat.co.th/enrol/index.php?id=2323"},{"branch":"สาขางานระบบผลิตไฟฟ้า","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า","level":"5","qual":"1. มีอายุไม่ต่ำกว่า 25 ปีบริบูรณ์\n2. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) สาขาที่เกี่ยวข้องและมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 4 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับปริญญาตรีหรือสูงกว่า สาขาวิศวกรรมศาสตร์/อุตสาหกรรมศาสตร์/ครุศาสตร์อุตสาหกรรม/วิทยาศาสตร์ หรือสาขาอื่นๆ ที่เกี่ยวข้องและมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n3. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า ระดับ 4 และต้องมีประสบการณ์การทำงานในตำแหน่งระดับ 4 ไม่น้อยกว่า 1 ปี\n4. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้า หรืออุตสาหกรรมอื่นๆ ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์ไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัด หรืองานวางแผนการผลิตและบำรุงรักษา หรืองานเดินเครื่องโรงไฟฟ้า ไม่น้อยกว่า 4 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าเชิงป้องกัน (Preventive Maintenance: PM)\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า (อุปกรณ์หลักและอุปกรณ์ สนับสนุน) ที่ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า\n- ควบคุมงานบำรุงรักษาอุปกรณ์ ัยพื้นฐาน\n- จัดทำแผนพัฒนาบุคลากรในหน่วยงาน\n- ประยุกต์การทำงานตามหลักการมาตรฐานสากล\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- กำกับและสนับสนุนงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า\n- กำกับดูแลการปรับเปลี่ยนอุปกรณ์ไฟฟ้าโรงไฟฟ้า","pass":"- เกณฑ์คะแนนแฟ้มสะสมผลงานผ่าน 70% ของคะแนนเต็ม หรือคิดเป็น 70 คะแนน\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- แฟ้มสะสมผลงาน เวลา 30 นาที\n- สัมภาษณ์\nจำนวน 9 หน่วย\nเวลาไม่เกิน 60 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279"},{"branch":"สาขางานระบบผลิตไฟฟ้า","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาเครื่องกำเนิดไฟฟ้า","level":"5","qual":"1. ผ่านการฝึกอบรมหลักสูตรที่เกี่ยวข้องกับการปฏิบัติงาน ดังนี้\n- ผ่านการอบรมด้านความปลอดภัยอาชีวอนามัยและสภาพแวดล้อมในการทำงานด้านไฟฟ้า\n- ผ่านการอบรมด้านความปลอดภัยอาชีวอนามัยและสภาพแวดล้อมในการทำงานเกี่ยวกับที่อับอากาศ\n2. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือเทียบเท่า สาขาไฟฟ้าหรืออิเล็กทรอนิกส์ และมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 5 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) หรือสูงกว่า สาขาไฟฟ้าหรืออิเล็กทรอนิกส์ และมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 3 ปีอย่างต่อเนื่อง\nหรือ\n3. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า ระดับ 4 และต้องปฏิบัติงานในอาชีพระดับ 4 ไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง","units":"หน่วยสมรรถนะด้านความปลอดภัย (Safety Unit)\n- ปฏิบัติตามข้อกำหนดด้านความปลอดภัยของงานบำรุงรักษาเครื่องกำเนิดไฟฟ้า (Generator)\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาเครื่องกำเนิดไฟฟ้า (Generator)\n- ซ่อมแซมส่วนประกอบของเครื่องกำเนิดไฟฟ้า (Generator)\n- เปลี่ยนขดลวดของเครื่องกำเนิดไฟฟ้า (Generator rewinding)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 63 ข้อ\n- ข้อสอบอัตนัย าในระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือสูงกว่า หรือเทียบเท่าทุกสาขา (สาขาวิชาช่างอุตสาหกรรม) ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 3 ปี อย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าหรืออุปกรณ์ควบคุมทางกล คุณวุฒิวิชาชีพ ระดับ 4 และมีประสบการณ์การทำงานในตำแหน่งระดับ 4 ไม่น้อยกว่า 2 ปี\n3. กำลังปฏิบัติงานอยู่ในตำแหน่งหัวหน้างานหรือผู้ควบคุมที่เกี่ยวข้องกับบอุปกรณ์ควบคุมทางกลในอุตสาหกรรมผลิตไฟฟ้าไม่น้อยกว่า 10 ปี และมีแฟ้มสะสมผลงาน (Portfolio)ยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ สามารถพิจารณาให้ผ่านการประเมินโดยต้องสัมภาษณ์ความรู้และทักษะตามแฟ้มสะสมผลงาน (Portfolio) ที่นำมายื่นในวันที่เข้ารับการประเมิน","units":"หน่วยสมรรถนะทางด้านความปลอดภัย (Safety Unit)\n- ปฏิบัติตามข้อกำหนดด้านความปลอดภัยของบำรุงรักษาอุปกรณ์ควบคุมทางกล โรงไฟฟ้า\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษา Pneumatic Control Valve ของโรงไฟฟ้า\n- บำรุงรักษา Motor Operated Valve ของโรงไฟฟ้า\n- บำรุงรักษา Control Drive ของโรงไฟฟ้า\n- บำรุงรักษาอุปกรณ์ประกอบของวาล์ว","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 49 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 70 ข้อ เวลา 70 นาที\n- ข้อสอบอัตนัย จำนวน 5 หน่วย เวลาไม่เกิน 90 นาที\n- สัมภาษณ์ จำนวน 5 หน่วย เวลาไม่เกิน 60 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ","level":"4","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพ (ปวช.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับปริญญาตรีหรือสูงกว่า สาขา\nวิศวกรรมศาสตร์/อุตสาหกรรมศาสตร์/ครุศาสตร์อุตสาหกรรม/วิทยาศาสตร์ หรือสาขาที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปี อย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า หน่วยสมรรถนะแกนกลางของการปฏิบัติงานในโรงไฟฟ้า และต้องมีประสบการณ์ในต่ำแหน่งระดับ 3 ไม่น้อยกว่า 1 ปี\n3. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้า ไม่น้อยกว่า 2 ปี\n4. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้าหรือ งานเดินเครื่องโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าหรืองานบำรุงรักษาโยธาโรงไฟฟ้า ไม่น้อยกว่า 3 ปี\n5. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าชนิดอื่นๆ หรือในอุตสาหกรรมอื่นๆ ในอาชีพที่เกี่ยวข้อง ไม่น้อยกว่า 4 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำเชิงป้องกัน Preventive Maintenance (PM)\n- บำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำที่ ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในงานบำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 70 ข้อ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 100 ข้อ เวลา 100 นาที\n- สัมภาษณ์ จำนวน 10 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ ระดับ 4 https://els.egat.co.th/enrol/index.php?id=2743"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ","level":"5","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพ (ปวช.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 4 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับปริญญาตรีหรือสูงกว่า สาขาวิศวกรรมศาสตร์/อุตสาหกรรมศาสตร์/ครุศาสตร์อุตสาหกรรม/วิทยาศาสตร์ หรือสาขาที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้าจากพลังน้ำอาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ คุณวุฒิวิชาชีพระดับ 4 และต้องมีประสบการณ์ในตำแหน่งระดับ 4 ไม่น้อยกว่า 1 ปี\n3. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าอื่นๆในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า หรืองานเดินเครื่องโรงไฟฟ้า หรืองานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้า หรืออุตสาหกรรมอื่นที่เกี่ยวข้องไม่น้อยกว่า 4 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำเชิงป้องกัน Preventive Maintenance (PM)\n- บำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำที่ ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในงานบำรุงรักษาระบบควบคุมและเครื่องมือวัด โรงไฟฟ้าพลังน้ำ\n- ควบคุมงานบำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำเชิง ป้องกัน (Preventive Maintenance: PM) และเชิงแก้ไข (Corrective Maintenance: CM)\n- ควบคุมงานบำรุงรักษาระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage) ตามสัญญาการให้บริการงานบำรุงรักษาและสัญญาประกันภัย (Insurance Agreement)\n- จัดทำข้อกำหนดและขอบเขตการดำเนินงาน (TOR) ของงานบำรุงรักษาระบบ ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ\n- ปรับเปลี่ยนอุปกรณ์ของระบบควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ และ เอกสารประกอบ (Improvement Maintenance: IM)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 84 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 120 ข้อ เวลา 120 นาที\n- ข้อสอบอัตนัย จำนวน 4 หน่วย เวลาไม่เกิน 90 นาที\n- สัมภาษณ์ จำนวน 9 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ ระดับ 5 https://els.egat.co.th/enrol/index.php?id=2861"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ","level":"6","qual":"1. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลั "level":"4","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ(ปวช.) สาขาที่เกี่ยวข้องและมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับปริญญาตรีหรือสูงกว่า สาขาวิศวกรรมศาสตร์ อุตสาหกรรมศาสตร์ ครุศาสตร์อุตสาหกรรม วิทยาศาสตร์ หรือสาขาที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า คุณวุฒิวิชาชีพระดับ3 และต้องมีประสบการณ์ทำงานในระดับ 3 ไม่น้อยกว่า 1 ปี\n3. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าไม่น้อยกว่า 2 ปี\n4. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้า หรืองานเดินเครื่องโรงไฟฟ้า หรือหรืองานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้า หรืองานบำรุงรักษาโยธาโรงไฟฟ้าไม่น้อยกว่า 3 ปี\n5. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าชนิดอื่นๆ หรือในอุตสาหกรรมอื่นๆ ในอาชีพที่เกี่ยวข้อง ไม่น้อยกว่า 4 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM)\n- บำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษ งานทดแทน สาขางานผลิตไฟฟ้าจากพลังน้ำ อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำ คุณวุฒิวิชาชีพระดับ 5 และมีประสบการณ์การทำงานในระดับ 5 ไม่น้อยกว่า 4 ปี\nหรือ\n2. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าชนิดอื่น ๆ ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัด หรืองานเดินเครื่องโรงไฟฟ้า หรืองานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้า หรืออุตสาหกรรมอื่นที่เกี่ยวข้อง ไม่น้อยกว่า 6 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n- จัดทำแผนพัฒนาบุคลากรในหน่วยงาน\n- ประยุกต์การทำงานตามหลักการมาตรฐานสากล\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- กำกับงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM)\n- กำกับงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- กำกับงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- กำกับการปรับเปลี่ยนอุปกรณ์ทางกลโรงไฟฟ้าในโรงไฟฟ้าพลังน้ำ (Improvement Maintenance: IM)","pass":"- เกณฑ์คะแนนแฟ้มสะสมผลงานผ่าน 70% ของคะแนนเต็ม หรือคิดเป็น 70 คะแนน\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- แฟ้มสะสมผลงาน เวลา 30 นาที\n- สัมภาษณ์ จำนวน 11 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์เครื่องมือวัดในอุตสาหกรรมผลิตไฟฟ้า","level":"5","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับมัธยมศึกษาปีที่ 3 และมีประสบการณ์ทำงานด้านอุปกรณ์เครื่องมือวัดไม่น้อยกว่า 5 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือสูงกว่า หรือเทียบเท่าทุกสาขา (สาขาวิชาช่างอุตสาหกรรม) ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 3 ปี อย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้าอาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าหรือเครื่องมือวัดโรงไฟฟ้า คุณวุฒิวิชาชีพ ระดับ 4 และมีประสบการณ์การทำงานในตำแหน่งระดับ 4 ไม่น้อยกว่า 2 ปี\n3. กำลังปฏิบัติงานอยู่ในตำแหน่งหัวหน้างานหรือผู้ควบคุมงานที่เกี่ยวข้องกับเครื่องมือวัดในอุตสาหกรรมผลิตไฟฟ้าไม่น้อยกว่า 10 ปี และมีแฟ้มสะสมผลงาน (Portfolio) ยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ สามารถพิจารณาให้ผ่านการประเมินโดยต้องสัมภาษณ์ความรู้และทักษะตามแฟ้มสะสมผลงาน (Portfolio) ที่นำมายื่นในวันที่เข้ารับการประเมิน","units":"หน่วยสมรรถนะทางด้านความปลอดภัย (Safety Unit)\n- ปฏิบัติตามข้อกำหนดด้านความปลอดภัยของบำรุงรักษาอุปกรณ์เครื่องมือวัดโรงไฟฟ้า\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาอุปกรณ์เครื่องมือวัดโรงไฟฟ้า\n- บำรุงรักษาอุปกรณ์วัดการสั่นสะเทือน (Vibration)\n- บำรุงรักษาเครื่องมือวิเคราะห์การทำงานของระบบโรงไฟฟ้า (Analyzer)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 49 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย\nจำนวน 70 ข้อ\nเวลา 70 นาที\n- ข้อสอบอัตนัย\nจำนวน 4 หน่วย\nเวลาไม่เกิน 120 นาที\n- สัมภาษณ์\nจำนวน 4 หน่วย เวลาไม่เกิน 60 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์เครื่องมือวัดในอุตสาหกรรมผลิตไฟฟ้า ระดับ 5 https://els.egat.co.th/course/view.php?id=2856"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ","level":"4","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ(ปวช.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับปริญญาตรีหรือสูงกว่า สาขาวิศวกรรมศาสตร์ อุตสาหกรรมศาสตร์ ครุศาสตร์อุตสาหกรรม วิทยาศาสตร์ หรือสาขาที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปี อย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงาน และพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า คุณวุฒิวิชาชีพระดับ 3 และต้องมีประสบการณ์ในตำแหน่งระดับ 3 ไม่น้อยกว่า 1 ปี\n3. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า ไม่น้อยกว่า 2 ปี\n4. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้า หรืองานเดินเครื่องโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้า หรือ งานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้า หรืองานบำรุงรักษาโยธาโรงไฟฟ้า ไม่น้อยกว่า 3 ปี\n5. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าชนิดอื่นๆ หรือในอุตสาหกรรมอื่นๆ ในอาชีพที่เกี่ยวข้อง ไม่น้อยกว่า 4 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM)\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ (อุปกรณ์หลักและ อุปกรณ์สนับสนุน) ที่ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ใน ยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM)\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ (อุปกรณ์หลักและ อุปกรณ์สนับสนุน) ที่ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ\n- ควบคุมงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM) และเชิงแก้ไข (Corrective Maintenance: CM)\n- ควบคุมงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage) ตามสัญญาการให้บริการงานบำรุงรักษา และสัญญา ประกันภัย (Insurance Agreement)\n- จัดทำข้อกำหนดและขอบเขตการดำเนินงาน (TOR) ของงานบำรุงรักษา อุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ\n- ปรับเปลี่ยนอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำและเอกสารประกอบ (Improvement Maintenance: IM)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 84 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 120 ข้อ เวลา 120 นาที\n- ข้อสอบอัตนัย จำนวน 4 หน่วย เวลาไม่เกิน 90 นาที\n- สัมภาษณ์ จำนวน 9 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ ระดับ 5 https://els.egat.co.th/enrol/index.php?id=2862"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ","level":"6","qual":"1. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ ส ชาชีพ (ปวช.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับปริญญาตรีหรือสูงกว่า สาขาวิศวกรรมศาสตร์ อุตสาหกรรมศาสตร์ ครุศาสตร์อุตสาหกรรม วิทยาศาสตร์ หรือสาขาที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า คุณวุฒิวิชาชีพระดับ3และต้องมีประสบการณ์ในตำแหน่งระดับ 3 ไม่น้อยกว่า 1 ปี\n3. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานบำรุงรักษาโยธาโรงไฟฟ้า ไม่น้อยกว่า 2 ปี\n4. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้า หรืองานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้า หรืองานเดินเครื่องโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้า หรืองานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าไม่น้อยกว่า 3 ปี\n5. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าชนิดอื่นๆ หรือในอุตสาหกรรมอื่นๆ ในอาชีพที่เกี่ยวข้อง ไม่น้อยกว่า 4 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM) โดยการตรวจสภาพด้วยสายตา (Visual inspection)\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM) โดยการตรวจสภาพเขื่อนของโรงไฟฟ้าพลังน้ำด้วยเครื่องมือวัดพฤติกรรม เขื่อน (Dam Instrument Inspection)\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- ติดตามงานบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำที่ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในการบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำ","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 70 ข้อ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 100 ข้อ เวลา 100 นาที\n- สัมภาษณ์ จำนวน 11 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานบำรุงรักษาโยธาโรงไฟฟ้าพลังน้ำ ระดับ 4 https://els.egat.co.th/enrol/index.php?id=2747"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาโยธาโรงไฟฟ้าพลังน้ำ","level":"5","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 4 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับปริญญาตรีหรือสูงกว่าสาขาวิศวกรรมศาสตร์ อุตสาหกรรมศาสตร์ ครุศาสตร์อุตสาหกรรม วิทยาศาสตร์ หรือสาขาที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\nหรือ\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานผลิตไฟฟ้าจากพลังน้ำ อาชีพผู้ปฏิบัติงานบำรุงรักษาโยธาโรงไฟฟ้าพลังน้ำ คุณวุฒิวิชาชีพระดับ 4 และต้องมีประสบการณ์ในตำแหน่งระดับ 4 ไม่น้อยกว่า 1 ปี","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM) โดยการตรวจสภาพด้วยสายตา (Visual inspection)\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังนํ้าเชิงป้องกัน (Preventive Maintenance: PM) โดยการตรวจสภาพเขื่อนของโรงไฟฟ้าพลังน้ำด้วยเครื่องมือวัดพฤติกรรม เขื่อน (Dam Instrument Inspection)\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- บำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\nติดตามงานบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำที่ดำเนินการโดยหน่วยงานภายนอก\n- บำรุงรักษาเครื่องมือที่ใช้ในการบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำ\n- ควบคุมงานบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM) โดยการตรวจสอบด้วยสายตา (Visual inspection)\n- ควบคุมงานบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM) โดยการตรวจสภาพเขื่อนของโรงไฟฟ้าพลังน้ำด้วย เครื่องมือวัดพฤติกรรมเขื่อน (Dam Instrument Inspection)\n- ควบคุมงานบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance: CM)\n- ควบคุมงานบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำแบบหยุดตามวาระ (Planned Outage)\n- จัดทำข้อกำหนดและขอบเขตการดำเนินงาน (TOR) ของงานบำรุงรักษาโยธา โรงไฟฟ้าพลังน้ำ","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 84 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 120 ข้อ เวลา 120 นาที\n- ข้อสอบอัตนัย จำนวน 5 หน่วย เวลาไม่เกิน 90 นาที\n- สัมภาษณ์ จำนวน 11 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานบำรุงรักษาโยธาโรงไฟฟ้าพลังน้ำ ระดับ 5 https://els.egat.co.th/enrol/index.php?id=2864"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาโยธาโรงไฟฟ้าพลังน้ำ","level":"6","qual":"1. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานผลิตไฟฟ้าจากพลังน้ำ อาชีพผู้ปฏิบัติงานบำรุงรักษาโยธาโรงไฟฟ้าพลังน้ำ คุณวุฒิวิชาชีพระดับ 5 และมีประสบการณ์การทำงานในตำแหน่งระดับ 5 ไม่น้อยกว่า 4 ปี\nหรือ\n2. มีประสบการณ์ในการทำงานในโรงไฟฟ้า และปฎิบัติงานเกี่ยวข้องกับงานบำรุงรักษาโยธาโรงไฟฟ้าไม่น้อยกว่า 6ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n- จัดทำแผนพัฒนาบุคลากรในหน่วยงาน\n- ประยุกต์การทำงานตามหลักการมาตรฐานสากล\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- กำกับงานบำรุงรักษาโยธาโรงไฟฟ้าพลังน้ำเชิงป้องกัน (Preventive Maintenance: PM)\n- กำกับงานบำรุงรักษาด้านโยธาของโรงไฟฟ้าพลังน้ำเชิงแก้ไข (Corrective Maintenance)\n- กำกับงานบำรุงรักษาโยธาของโรงไฟฟ้าพลังน้ำ แบบหยุดตามวาระ (Planned Outage)","pass":"- เกณฑ์คะแนนแฟ้มสะสมผลงานผ่าน 70% ของคะแนนเต็ม หรือคิดเป็น 70 คะแนน\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- แฟ้มสะสมผลงาน เวลา 30 นาที\n- สัมภาษณ์ จำนวน 10 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้าพลังน้ำ","level":"6","qual":"1. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงาน ทดแทน สาขางานผลิตไฟฟ้าจากพลังน้ำ ข้อใดข้อหนึ่งดังต่อไปนี้\n- เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานผลิตไฟฟ้าจากพลังน้ำ อาชีพผู้ปฏิบัติงานเดินเครื่องโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำ คุณวุฒิวิชาชีพระดับ 4 และมีประสบการณ์การทำงานอยู่ใน ระดับ 4 ไม่น้อยกว่า 4 ปี โดยต้องมีแฟ้มสะสมผลงาน (Portfolio) ยืนยัน\n- เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานผลิตไฟฟ้าจากพลังน้ำ อาชีพผู้ปฏิบัติงานเดินเครื่องโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำ คุณวุฒิวิชาชีพระดับ 5 และมีประสบการณ์การทำงานในระดับ 5 ไม่น้อยกว่า 2 ปี โดยต้องมีแฟ้มสะสมผลงาน (Portfolio) ยืนยัน\n- เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานผลิตไฟฟ้าจากพลังน้ำ อาชีพผู้ปฏิบัติงานเดินเครื่องโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังน้ำหรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ควบคุมและเครื่องมือวัดโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้าพลังน้ำ หรืออาชีพผู้ปฏิบัติงานควบคุมและตรวจสอบประสิทธิภาพโรงไฟฟ้าพลังน้ำ คุณวุฒิวิชาชีพระดับ 6 และมีประสบการณ์การทำงานในระดับ 6 ไม่น้อยกว่า 1 ปี\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพที่เกี่ยวข้องกับงานบำรุงรักษาคุณวุฒิวิชาชีพระดับ 5 และมีประสบการณ์การทำงานอยู่ในระดับ 5 ไม่น้อยกว่า 2 ปี และมีแฟ้มสะสมผลงาน (Portfolio) ยืนยันประสบการณ์การทำงาน\n3. มีประสบการณ์ในการทำงานในโรงไฟฟ้า และปฎิบัติงานเกี่ยวข้องกับงานบำรุงรักษาโรงไฟฟ้า ไม่น้อยกว่า 6 ปี และมีแฟ้มสะสมผลงาน (Portfolio) ยืนยันประสบการณ์การทำงาน\n4. มีประสบการณ์ทำงานในอุตสาหกรรมอื่นๆ ที่เกี่ยวข้อง ไม่น้อยกว่า 8 ปี และมีแฟ้มสะสมผลงาน (Portfolio) ยืนยันประสบการณ์การทำงาน","units":"หน่วยสมรรถนะพื้นฐาน\n- ศึกษาหลักการพื้นฐานของระบบกำลังไฟฟ้า\n- ศึกษาหลักการทำงานโรงไฟฟ้า\n- ศึกษาหลักการบำรุงรักษา\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัย อาชีวอนามัย และสิ่งแวดล้อม\n- ปฏิบัติงานในโรงไฟฟ้าตามหลักความปลอดภัยพื้นฐาน\n\nหน่วยสมรรถนะทางด้านเทคนิค\n- วางแผนบำรุงรักษาโรงไฟฟ้าพลังน้ำ\n- ควบคุมแผนการบำรุงรักษาอุปกรณ์ในโรงไฟฟ้าพลังน้ำ\n- วางแผนการผลิตโรงไฟฟ้าพลังน้ำ\n- จัดทำข้อกำหนดและขอบเขตการดำเนินงาน (TOR) สำหรับจัดซื้อชิ้นส่วนอะไหล่ และเครื่องมือของงานบำรุงรักษาโรงไฟฟ้าพลังน้ำ\n- รวบรวมข้อมูลในระบบการจัดการงานบำรุงรักษาด้วยคอมพิวเตอร์ (Computerize Maintenance Management System: CMMS) ของโรงไฟฟ้าพลังน้ำ\n- ติดตามสัญญาการให้บริการงานบำรุงรักษาและปฏิบัติตามสัญญาประกันภัยของโรงไฟฟ้าพลังน้ำ\n- บริหารจัดการชิ้นส่วนอะไหล่ วัสดุสิ้นเปลืองและคลังพัสดุ ของโรงไฟฟ้าพลังน้ำ","pass":"- เกณฑ์คะแนนแฟ้มสะสมผลงานผ่าน 70% ของคะแนนเต็ม หรือคิดเป็น 70 คะแนน\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- แฟ้มสะสมผลงาน เวลา 30 นาที\n- สัมภาษณ์ จำนวน 12 หน่วย เวลาไม่เกิน 90 นาที","els":"1. หลักสูตรทบทวนความรู้ ความปลอดภัยการปฏิบัติงานในโรงไฟฟ้า https://els.egat.co.th/enrol/index.php?id=2506\n2. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า ระดับ 3 https://els.egat.co.th/course/view.php?id=2279\n3. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานวางแผนการผลิตและบำรุงรักษาโรงไฟฟ้าพลังน้ำ ระดับ 6 https://els.egat.co.th/enrol/index.php?id=2745"},{"branch":"สาขางานผลิตไฟฟ้าจากพลังน้ำ","job":"อาชีพผู้ปฏิบัติงานเดินเครื่องโรงไฟฟ้าพลังน้ำ","level":"4","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพ (ปวช.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับปริญญาตรีหรือสูงกว่า สาขาวิศวกรรมศาสตร์ อุตสาหกรรมศาสตร์ ครุศาสตร์อุตสาหกรรม วิทยาศาสตร์ หรือสาขาที่เกี่ยวข้อง และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปีอย่างต่อเนื่อง\n\nหรือ มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n2. เป็นผู้ผ่านการประเมินคุณวุฒิวิชาชีพ สาขาวิชาชีพพลังงานและพลังงานทดแทน สาขางานระบบผลิตไฟฟ้า อาชีพผู้ปฏิบัติงานเดินเครื่องและบำรุงรักษาโรงไฟฟ้า คุณวุฒิวิชาชีพระดับ 3 และต้องมีประสบการณ์ทำงานในระดับ 3 ไม่น้อยกว่า 1 ปี\n3. มีประสบการณ์หรือกำลังปฏิบัติงานในโรงไฟฟ้าพลังน้ำ ในอาชีพที่เกี่ยวข้องกับงานเดินเครื่องโรงไฟฟ้า ไม่น้อยก บัติงานในสถานีไฟฟ้าแรงสูง","level":"4","qual":"1. มีวุฒิการศึกษาผ่านเกณฑ์ข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือเทียบเท่า สาขาวิชาไฟฟ้า หรือสาขาวิชาอิเล็กทรอนิกส์ หรือสาขาอื่นที่เกี่ยวข้อง และมีประสบการณ์ที่เกี่ยวข้อง ไม่น้อยกว่า 3 ปี อย่างต่อเนื่อง\n- สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) หรือเทียบเท่า หรือสูงกว่า สาขาวิชาไฟฟ้า หรือสาขาวิชาอิเล็กทรอนิกส์ หรือสาขาอื่นที่เกี่ยวข้องและมีประสบการณ์ที่เกี่ยวข้อง ไม่น้อยกว่า 1 ปี อย่างต่อเนื่อง\n\nหรือ\n2. มีประสบการณ์หรือกำลังปฏิบัติงานด้านอุปกรณ์ไฟฟ้าสถานีไฟฟ้าแรงสูง หรือควบคุมการจ่ายกระแสไฟฟ้า ในอาชีพที่เกี่ยวข้อง ไม่น้อยกว่า 5 ปี และมีแฟ้มสะสมผลงาน (Portfolio) จากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่ตรงกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะ (Unit of Competence)\n- ปฏิบัติงานตามหลักความปลอดภัยในสถานีไฟฟ้าแรงสูง\n- ปฏิบัติงานการส่งไฟฟ้าสถานีไฟฟ้าแรงสูง\n- ปลด-สับอุปกรณ์ไฟฟ้าแรงสูง (Switching) ในการควบคุมการจ่ายไฟฟ้า\n- ปฏิบัติงานแก้ไขปัญหาระบบส่งกำลังไฟฟ้าในสภาวะฉุกเฉิน (Restoration) (ไฟดับ)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 60% หรือคิดเป็นจำนวน 60 ข้อ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 100 ข้อ เวลา 100 นาที\n- สัมภาษณ์ จำนวน 4 หน่วย เวลาไม่เกิน 60 นาที","els":"1. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานในสถานีไฟฟ้าแรงสูง ระดับ 4 https://els.egat.co.th/enrol/index.php?id=2883"},{"branch":"สาขาพลังงานไฟฟ้าจากเซลล์แสงอาทิตย์","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาระบบไฟฟ้าต่อเนื่อง","level":"5","qual":"1. ผ่านการฝึกอบรมดังต่อไปนี้\n- ผ่านการอบรมการปฏิบัติงานด้านไฟฟ้า\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานในการใช้รอกและสลิง\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานกับสารเคมี\n2. มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือเทียบเท่า ในสาขาวิชาช่างไฟฟ้า หรือช่างอิเล็กทรอนิกส์ ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 4 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) หรือเทียบเท่า ในสาขาวิชาช่างไฟฟ้าหรือช่างอิเล็กทรอนิกส์ ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 3 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับปริญญาตรี (ป.ตรี) หรือสูงกว่า ในสาขาวิศวกรรมหรือเทียบเท่า (สาขาไฟฟ้าหรืออิเล็กทรอนิกส์) และมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 2 ปีอย่างต่อเนื่อง\n- ผ่านการประเมินในอาชีพผู้ปฏิบัติงานด้านการบำรุงรักษาอุปกรณ์ไฟฟ้าหรือเครื่องมือวัดไฟฟ้า คุณวุฒิวิชาชีพระดับ 4 และมีประสบการณ์การทำงานที่เกี่ยวข้องไม่น้อยกว่า 2 ปี\n- มีประสบการณ์หรือกำลังปฏิบัติงานในตำแหน่งหัวหน้างาน ในงานบำรุงรักษาที่เกี่ยวข้องกับอุปกรณ์ไฟฟ้า ไม่น้อยกว่า 10 ปี โดยมีหลักฐานแสดงรายละเอียดประวัติการปฏิบัติงานจากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่สอดคล้องกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะ (Unit of Competence)\n- ปฏิบัติตามข้อกำหนดด้านความปลอดภัยของงานบำรุงรักษาระบบไฟฟ้าต่อเนื่อง\n- บำรุงรักษาแบตเตอรี่แบบติดตั้งอยู่กับที่ (Stationary Battery)\n- บำรุงรักษาเครื่องชาร์จแบตเตอรี่ (Battery Charger)\n- บำรุงรักษาเครื่องแปลงไฟฟ้ากระแสตรงเป็นกระแสสลับ (Static Inverter)\n- บำรุงรักษาเครื่องสำรองไฟฟ้า (Uninterruptible Power Supply)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 69 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย\nจำนวน 95 ข้อ\nเวลา 95 นาที\n- ข้อสอบอัตนัย\nจำนวน 5 หน่วย\nเวลาไม่เกิน 90 นาที\n- สัมภาษณ์\nจำนวน 5 หน่วย\nเวลาไม่เกิน 60 นาที","els":"อยู่ระหว่างดำเนินการจัดทำหลักสูตรทบทวนความรู้"},{"branch":"สาขาพลังงานไฟฟ้าจากเซลล์แสงอาทิตย์","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าโรงไฟฟ้าพลังงานแสงอาทิตย์","level":"5","qual":"1. ผ่านการฝึกอบรมดังต่อไปนี้\n- ผ่านการอบรมด้านการปฏิบัติงานด้านไฟฟ้า\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานในการใช้รอกและสลิง\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานบนที่สูง\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานกับสารเคมี\n2. มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือเทียบเท่า ในสาขาวิชาช่างไฟฟ้าหรือช่างอิเล็กทรอนิกส์ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 4 ปี อย่างต่อเนื่อง\n- ส n3. มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับมัธยมศึกษาปีที่ 3 และมีประสบการณ์ทำงานด้านการบำรุงรักษาที่เกี่ยวข้องไม่น้อยกว่า 5 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือสูงกว่า หรือเทียบเท่าสาขาวิชาอุตสาหกรรม และมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 3 ปีอย่างต่อเนื่อง\n- ผ่านการประเมินในมาตรฐานอาชีพผู้ปฏิบัติงานด้านการบำรุงรักษาอุปกรณ์ทางกลโรงไฟฟ้า หรือโรงไฟฟ้าพลังงานลม คุณวุฒิวิชาชีพระดับ 4 และมีประสบการณ์การทำงานที่เกี่ยวข้อง ไม่น้อยกว่า 2 ปี\n- มีประสบการณ์ในงานบำรุงรักษาที่เกี่ยวข้องกับอุปกรณ์ทางกลโรงไฟฟ้า หรือโรงไฟฟ้าพลังงานลม ไม่น้อยกว่า 7 ปี โดยมีหลักฐานแสดงรายละเอียดประวัติการปฏิบัติงานจากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่สอดคล้องกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะ (Unit of Competence)\n- ปฏิบัติตามข้อกำหนดด้านความปลอดภัยของงานบำรุงรักษาอุปกรณ์ทางกลของกังหันลม (Wind Turbine)\n- บำรุงรักษาระบบต้นกำลังและส่งพลังงาน (Main Machine Train) ของกังหันลม (Wind Turbine)\n- บำรุงรักษาโครงสร้างและส่วนรับแรง (Support & Structure) ของกังหันลม (Wind Turbine)\n- บำรุงรักษาระบบประกอบอื่นๆ (Auxiliary) ของกังหันลม (Wind Turbine)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 69 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 95 ข้อ เวลา 95 นาที\n- ข้อสอบอัตนัย จำนวน 4 หน่วย เวลาไม่เกิน 90 นาที\n- สัมภาษณ์ จำนวน 4 หน่วย เวลาไม่เกิน 60 นาที","els":"1. หลักสูตรทบทวนความรู้ อาชีพผู้ปฏิบัติงานทดสอบสภาพฉนวนน้ำมันของอุปกรณ์ไฟฟ้า ระดับ 4 https://els.egat.co.th/enrol/index.php?id=3081"},{"branch":"สาขางานระบบผลิตไฟฟ้าจากพลังงานลม","job":"อาชีพผู้ปฏิบัติงานบำรุงรักษาอุปกรณ์ไฟฟ้าของกังหันลม","level":"5","qual":"1. ผ่านการฝึกอบรมดังต่อไปนี้\n- ผ่านการอบรมการปฏิบัติงานด้านไฟฟ้า\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานในที่อับอากาศ\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานในการใช้รอกและสลิง\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานบนที่สูง\n- ผ่านการอบรมด้านความปลอดภัยในการปฏิบัติงานกับสารเคมี\n\n2. มีคุณสมบัติข้อใดข้อหนึ่งดังต่อไปนี้\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือเทียบเท่า สาขาวิชาช่างไฟฟ้า หรือช่างอิเล็กทรอนิกส์ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 4 ปี อย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) หรือเทียบเท่า สาขาวิชาช่างไฟฟ้าหรือช่างอิเล็กทรอนิกส์ ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 3 ปีอย่างต่อเนื่อง\n- สำเร็จการศึกษาในระดับปริญญาตรี (ป.ตรี) สาขาวิศวกรรมหรือเทียบเท่า สาขาไฟฟ้า หรืออิเล็กทรอนิกส์ ขึ้นไปและมีประสบการณ์ทำงานที่เกี่ยวข้องไม่น้อยกว่า 2 ปี อย่างต่อเนื่อง\n- ผ่านการประเมินในมาตรฐานอาชีพผู้ปฏิบัติงานด้านการบำรุงรักษาอุปกรณ์ไฟฟ้าหรือเครื่องมือวัดโรงไฟฟ้า หรือโรงไฟฟ้าพลังงานลม คุณวุฒิวิชาชีพระดับ 4 และมีประสบการณ์การทำงานที่เกี่ยวข้องไม่น้อยกว่า 2 ปี\n- มีประสบการณ์หรือกำลังปฏิบัติงานในตำแหน่งหัวหน้างาน* ในงานบำรุงรักษาที่เกี่ยวข้องกับอุปกรณ์ไฟฟ้าโรงไฟฟ้า หรือโรงไฟฟ้าพลังงานลม ไม่น้อยกว่า 10 ปี โดยมีหลักฐานแสดงรายละเอียดประวัติการปฏิบัติงานจากสถานประกอบการเพื่อยืนยันในรายละเอียดความรู้และทักษะที่สอดคล้องกับหน่วยสมรรถนะ","units":"หน่วยสมรรถนะ (Unit of Competence)\n- ปฏิบัติตามข้อกำหนดด้านความปลอดภัยของงานบำรุงรักษาอุปกรณ์ไฟฟ้าของกังหันลม (Wind Turbine)\n- บำรุงรักษาเครื่องกำเนิดไฟฟ้า (Generator) ของกังหันลม (Wind Turbine)\n- บำรุงรักษาอุปกรณ์ควบคุมและอุปกรณ์ประกอบของกังหันลม (Wind Turbine)\n- บำรุงรักษาอุปกรณ์ไฟฟ้าและอุปกรณ์ประกอบในระบบผลิตไฟฟ้าจากกังหันลม (Wind Turbine)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 70% หรือคิดเป็นจำนวน 69 ข้อ\n- เกณฑ์การผ่านข้อสอบอัตนัย ต้องผ่านทุกหน่วยสมรรถนะ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 95 ข้อ เวลา 95 นาที\n- ข้อสอบอัตนัย จำนวน 4 หน่วย เวลาไม่เกิน 90 นาที\n- สัมภาษณ์ จำนวน 4 หน่วย เวลาไม่เกิน 60 นาที","els":"อยู่ระหว่างดำเนินการจัดทำหลักสูตรทบทวนความรู้"},{"branch":"สาขายานยนต์ไฟฟ้า","job":"อาชีพช่างเทคนิคติดตั้งและซ่อมบำรุงสถานีบริการอัดประจุไฟฟ้าสำหรับยานยนต์ไฟฟ้า","level":"4","qual":"1. อายุไม่ต่ำกว่า 18 ปีบริบูรณ์\n2. มีคุณสมบัติดังต่อไปนี้\n- มีประสบการณ์ทำงานด้านการติดตั้งและ/หรือซ่อมบำรุงสถานีบริการอัดประจุสำหรับยานยนต์ไฟฟ้ามาไม่น้อยกว่า 3 ปี\nหรือ\n- มีประสบการณ์ทำงานด้านระบบไฟฟ้าทั่วไปมาไม่น้อยกว่า 3 ปี\nและผ่านการฝึกอบรมเกี่ยวกับการติดตั้งและซ่อมบำรุงสถานีบริการอัดประจุสำหรับยานยนต์ไฟฟ้าที่เกี่ยวข้องกับหน่วยสรรถนะอาชีพในระดับนี้มาไม่น้อยกว่า\n30 ชั่วโมง\nหรือ\n- สำเร็จการศึกษาขั้นต่ำระดับประกาศนียบัตรวิชาชีพ (ปวช.) หรือเทียบเท่า และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 1 ปี\nและผ่านการฝึกอบรมหรือการเรียนที่เกี่ยวข้องกับหน่วยสรรถนะอาชีพในระดับนี้มาไม่น้อยกว่า 30 ชั่วโมง\nหรือ\n- สำเร็จการศึกษาขั้นต่ำระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) หรือเทียบเท่า และมีประสบการณ์ในการทำงานที่เกี่ยวข้องไม่น้อยกว่า 6 เดือน\nและผ่านการฝึกอบรมหรือการเรียนที่เกี่ยวข้องกับหน่วยสรรถนะอาชีพในระดับนี้มาไม่น้อยกว่า 30 ชั่วโมง","units":"หน่วยสมรรถนะ (Unit of Competence)\n- ปฏิบัติงานในสถานีบริการอัดประจุไฟฟ้าและเชื้อเพลิงได้อย่างปลอดภัย\n- สำรวจและประเมินสภาพความพร้อมของพื้นที่ติดตั้งสถานีอัดประจุไฟฟ้าได้ตามมาตรฐาน\n- เขียนแบบระบบไฟฟ้าและระบบป้องกันได้ตามมาตรฐาน\n- จัดเตรียมอุปกรณ์สำหรับงานติดตั้งสถานีอัดประจุไฟฟ้าได้ถูกต้องตามแบบ/ใบงาน\n- ติดตั้งและตรวจสอบการทำงานของเครื่องอัดประจุไฟฟ้าและบริภัณฑ์สำหรับสถานีอัดประจุไฟฟ้าได้ตามมาตรฐาน\n- ตรวจสอบและแก้ไขปัญหาเครื่องอัดประจุไฟฟ้าและบริภัณฑ์ได้ตามมาตรฐาน\n- ทดสอบและส่งมอบสถานีอัดประจุไฟฟ้าได้ตามมาตรฐาน (Commissioning test)","pass":"- ข้อสอบปรนัย เกณฑ์ผ่าน 80% หรือคิดเป็นจำนวน 42 ข้อ\n- เกณฑ์การผ่านข้อสอบสัมภาษณ์และสอบภาคปฎิบัติ ต้องผ่านทุกหน่วยสมรรถนะ","tools":"- ข้อสอบปรนัย จำนวน 51 ข้อ เวลาไม่เกิน 60 นาที\n- สอบสัมภาษณ์และสอบภาคปฏิบัติ เวลาไม่เกิน 180 นาที","els":"-"},{"branch":"สาขายานยนต์ไฟฟ้า","job":"อาชีพช่างเทคนิคติดตั้งและซ่อมบำรุงสถานีบริการอัดประจุไฟฟ้าสำหรับยานยนต์ไฟฟ้า","level":"5","qual":"1. อายุไม่ต่ำกว่า 18 ปีบริบูรณ์\n2. มีคุณสมบัติดังต่อไปนี้\n- ได้รับคุณวุฒิวิชาชีพ อาชีพช่างเทคนิคติดตั้งและซ่อมบำรุงสถานีบริการอัดประจุไฟฟ้าสำหรับยานยนต์ไฟฟ้า ระดับ 4 มาไม่น้อยกว่า 1 ปี\nหรือ\n- มีประสบการณ์ทำงานด้านระบบไฟฟ้าทั่วไปมาไม่น้อยกว่า 5 ปี\nหรือ\n- มีประสบการณ์ทำงานด้านระบบไฟฟ้าทั่วไปมาไม่น้อยกว่า 4 ปี\nและผ่ function refresh(){
  const b=$("#fb").value;

  const byBJ=byB.filter(d=>!j||d.job===j);
  if(l&&!byBJ.some(d=>d.level===l))l="";
  opts($("#fb"),"ทุกสาขา",uniq(DATA.map(d=>d.branch)),b);
  opts($("#fj"),"ทุกอาชีพ",uniq(byB.map(d=>d.job)),j);
  opts($("#fl"),"ทุกระดับ",uniq(byBJ.map(d=>d.level)).sort(),l);
  syncCombos();
  const rows=DATA.filter(d=>(!b||d.branch===b)&&(!j||d.job===j)&&(!l||d.level===l));
  $("#nJob").textContent=uniq(rows.map(d=>d.job)).length;
  $("#nLv").textContent=rows.length;
  $("#tJob").textContent="จากทั้งหมด "+T.job;
  $("#tLv").textContent="จากทั้งหมด "+T.lv;
  $("#count").textContent=`พบ ${rows.length} รายการ`;
  $("#list").innerHTML=rows.length?rows.map((d,i)=>`
   <div class="card${rows.length===1?" open":""}">
    <button class="head" type="button" aria-expanded="${rows.length===1}"><span class="lv">ระดับ ${esc(d.level)}</span>
      <span class="ttl"><b>${esc(d.job)}</b><span>${esc(d.branch)}</span></span></button>

}

}
function initCombo(selId,inpId,allLabel){
  const sel=$("#"+selId),inp=$("#"+inpId),lst=inp.nextElementSibling;
  let items=[],act=0;
  const key=s=>s.toLowerCase().replace(/\s+/g,"");
  const isOpen=()=>!lst.hidden;
  const hide=()=>{lst.hidden=true;inp.setAttribute("aria-expanded","false")};
  const show=q=>{
    const n=key(q||"");
    const vals=[...sel.options].map(o=>o.value).filter(Boolean).filter(v=>!n||key(v).includes(n));
    items=n?vals:[""].concat(vals);
    act=Math.max(0,items.indexOf(sel.value));
    lst.innerHTML=items.length?items.map((v,i)=>`<li role="option" data-i="${i}" aria-selected="${v===sel.value}" class="${i===act?"on":""}">${esc(v||allLabel)}</li>`).join(""):'<li class="none">ไม่พบรายการที่ตรงกับคำค้น</li>';
    lst.hidden=false;inp.setAttribute("aria-expanded","true");
    const on=lst.querySelector(".on");if(on)on.scrollIntoView({block:"nearest"});
  };
  const choose=v=>{sel.value=v;sel.dispatchEvent(new Event("change"));hide();inp.blur()};
  const move=d=>{if(!items.length)return;act=(act+d+items.length)%items.length;[...lst.children].forEach((li,i)=>li.classList.toggle("on",i===act));lst.children[act].scrollIntoView({block:"nearest"})};
  inp.addEventListener("focus",()=>{inp.select();show("")});
  inp.addEventListener("click",()=>{if(!isOpen())show("")});
  inp.addEventListener("input",()=>show(inp.value));
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();isOpen()?move(1):show("")}
    else if(e.key==="ArrowUp"){e.preventDefault();move(-1)}
    else if(e.key==="Enter"){if(isOpen()&&items.length){e.preventDefault();choose(items[act])}}
    else if(e.key==="Escape"){hide();inp.blur()}
  });
  inp.addEventListener("blur",()=>{hide();inp.value=sel.value});
  lst.addEventListener("mousedown",e=>e.preventDefault());
  lst.addEventListener("click",e=>{const li=e.target.closest("li[data-i]");if(li)choose(items[+li.dataset.i])});
  return ()=>{if(document.activeElement!==inp)inp.value=sel.value};
}
const combos=[initCombo("fb","fbq","ทุกสาขา"),initCombo("fj","fjq","ทุกอาชีพ")];
function syncCombos(){combos.forEach(f=>f())}
$("#past").addEventListener("change",refresh);
function setTab(n,upd){
  [1,2].forEach(i=>{$("#t"+i).setAttribute("aria-selected",i===n);$("#p"+i).hidden=i!==n});
  if(upd)history.replaceState(null,"",n===2?"#rounds":location.pathname+location.search);
}
$("#t1").addEventListener("click",()=>setTab(1,true));
$("#t2").addEventListener("click",()=>setTab(2,true));
window.addEventListener("hashchange",()=>setTab(location.hash==="#rounds"?2:1,false));
setTab(location.hash==="#rounds"?2:1,false);
refresh();
</script>
